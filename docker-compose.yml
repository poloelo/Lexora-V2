services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: lexora-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_PATH=/app/data/lexora.db
      - OLLAMA_URL=http://host.docker.internal:11434
      # Journal d'activité (NoSQL) : le backend joint Redis par le nom du service
      - REDIS_URL=redis://redis:6379
      # Surchargez JWT_SECRET et OLLAMA_MODEL via un fichier .env ou une variable d'env
      # OLLAMA_MODEL=llama3.2
    volumes:
      - sqlite-data:/app/data
      # BUG CORRIGÉ : les fichiers uploadés doivent être persistés dans un volume.
      # Sans ce volume, tous les fichiers sont perdus au redémarrage du conteneur
      # alors que leurs métadonnées restent en base SQLite → incohérence.
      - uploads-data:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: unless-stopped

  # Base NoSQL clé-valeur pour le journal d'activité (voir services/activity.js).
  # --appendonly yes : Redis écrit chaque commande sur disque, le journal
  # survit donc à un redémarrage du conteneur.
  redis:
    image: redis:7-alpine
    container_name: lexora-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: lexora-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  # Persistance de la base SQLite
  sqlite-data:
  # Persistance des fichiers uploadés dans le coffre-fort documentaire
  uploads-data:
  # Persistance du journal d'activité Redis
  redis-data:
